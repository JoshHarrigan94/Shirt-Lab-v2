<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShirtLab</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #viewport {
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;

            color: white;

            background: rgba(0,0,0,0.6);

            padding: 16px;
            border-radius: 12px;

            min-width: 220px;
        }

        #hud h1 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #hud p {
            margin-bottom: 6px;
            opacity: 0.85;
        }

        #toolbar {
            position: absolute;
            bottom: 20px;
            left: 20px;

            display: flex;
            gap: 10px;

            z-index: 10;
        }

        button {
            border: none;
            border-radius: 8px;

            padding: 10px 14px;

            cursor: pointer;

            background: white;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div id="app">

    <div id="viewport"></div>

    <div id="hud">
        <h1>ShirtLab</h1>

        <p>Human Viewer</p>
        <p>Status: Initialising...</p>
    </div>

    <div id="toolbar">
        <button id="frontView">Front</button>
        <button id="sideView">Side</button>
        <button id="backView">Back</button>
    </div>

</div>

<script type="module">

    import * as THREE from "https://unpkg.com/three@0.179.1/build/three.module.js";

    window.THREE = THREE;

    import "./src/app/App.js";

</script>

</body>
</html>
