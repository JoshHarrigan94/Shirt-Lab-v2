<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShirtLab V3</title>
  <link rel="stylesheet" href="./src/ui/styles.css" />
</head>
<body>
  <main id="app">
    <section id="visual-stage" aria-label="ShirtLab visual wind tunnel">
      <div id="curtains-canvas"></div>

      <div class="hero-frame">
        <div id="wind-layer" class="wind-layer"></div>
        <div id="heat-layer" class="heat-layer"></div>

        <div class="athlete-wrap">
          <div class="athlete-shadow"></div>
          <div class="athlete">
            <div class="head"></div>
            <div class="neck"></div>
            <div id="shirt-plane" class="shirt-plane plane">
              <div class="collar-cut"></div>
              <div id="perforation-layer" class="perforation-layer"></div>
              <div id="moisture-layer" class="moisture-layer"></div>
              <div class="shirt-label">SHIRTLAB</div>
            </div>
            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>
            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>
          </div>
        </div>
      </div>

      <div class="stage-title">
        <p>Digital Sportswear Wind Tunnel</p>
        <h1>Visualise cooling, sweat and airflow trade-offs.</h1>
      </div>
    </section>

    <button id="controls-toggle" class="drawer-toggle left">☰ Controls</button>
    <button id="results-toggle" class="drawer-toggle right">Results ▸</button>

    <aside id="controls-drawer" class="drawer controls open">
      <div class="drawer-header">
        <h2>Controls</h2>
        <p>Change the shared simulation state.</p>
      </div>
      <div id="controls-root"></div>
    </aside>

    <aside id="results-drawer" class="drawer results open">
      <div class="drawer-header">
        <h2>Output</h2>
        <p>Maths summary from the same state.</p>
      </div>
      <div id="hud-root"></div>
    </aside>

    <div id="boot-panel" class="boot-panel"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/curtainsjs@8.1.3/dist/curtains.umd.min.js"></script>
  <script type="module" src="./src/app/App.js"></script>
</body>
</html>
