<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShirtLab</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #0e1116;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #viewport {
            width: 100%;
            height: 100%;
        }

        /* -------------------------- */
        /* HUD                        */
        /* -------------------------- */

        #hud {

            position: absolute;

            top: 20px;
            left: 20px;

            width: 280px;

            background:
                rgba(0,0,0,0.75);

            border:
                1px solid rgba(255,255,255,0.08);

            backdrop-filter: blur(12px);

            color: white;

            border-radius: 16px;

            padding: 18px;

            z-index: 100;
        }

        #hud h1 {

            font-size: 20px;
            font-weight: 700;

            margin-bottom: 12px;

        }

        #hud p {

            font-size: 14px;

            opacity: 0.9;

            margin-bottom: 8px;

        }

        /* -------------------------- */
        /* Toolbar                    */
        /* -------------------------- */

        #toolbar {

            position: absolute;

            bottom: 20px;
            left: 20px;

            display: flex;
            flex-wrap: wrap;

            gap: 10px;

            max-width: 900px;

            z-index: 100;

        }

        button {

            border: none;

            padding:
                10px 14px;

            border-radius: 10px;

            background: white;

            cursor: pointer;

            font-weight: 600;

            transition: 0.2s;

        }

        button:hover {

            transform: translateY(-1px);

        }

        /* -------------------------- */
        /* Legend                     */
        /* -------------------------- */

        #legend {

            position: absolute;

            right: 20px;
            top: 20px;

            width: 240px;

            background:
                rgba(0,0,0,0.75);

            border:
                1px solid rgba(255,255,255,0.08);

            backdrop-filter: blur(12px);

            border-radius: 16px;

            padding: 16px;

            color: white;

            z-index: 100;

        }

        #legend h2 {

            font-size: 16px;

            margin-bottom: 10px;

        }

        #legend p {

            font-size: 13px;

            opacity: 0.8;

            margin-bottom: 6px;

        }

    </style>

</head>

<body>

<div id="app">

    <!-- Three.js Canvas -->
    <div id="viewport"></div>

    <!-- HUD -->
    <div id="hud">

        <h1>ShirtLab</h1>

        <p>Initialising...</p>

    </div>

    <!-- Legend -->

    <div id="legend">

        <h2>Controls</h2>

        <p>Camera Views</p>
        <p>Fit Selection</p>
        <p>Wind Speed</p>
        <p>Moisture</p>
        <p>Perforation Patterns</p>

    </div>

    <!-- Toolbar -->

    <button id="drawerToggle">

☰ Controls

</button>

<div
    id="controlsDrawer"
    style="
        display:none;
        position:absolute;
        left:20px;
        top:120px;
        width:280px;
        background:black;
        padding:16px;
        border-radius:12px;
        z-index:100;
    "
>

<h3>Environment</h3>

<button id="windSlow">
5mph
</button>

<button id="windFast">
15mph
</button>

<hr>

<h3>Fit</h3>

<button id="compressionFit">
Compression
</button>

<button id="regularFit">
Regular
</button>

<button id="oversizedFit">
Oversized
</button>

<hr>

<h3>Moisture</h3>

<button id="dryBtn">
Dry
</button>

<button id="dampBtn">
Damp
</button>

<button id="soakedBtn">
Soaked
</button>

<hr>

<h3>Perforation</h3>

<button id="noPerforation">
Plain
</button>

<button id="gridPerforation">
Grid
</button>

<button id="spinePerforation">
Spine
</button>

<button id="mothTechPerforation">
MothTech
</button>

</div>

</div>

<!-- Three.js -->

<script type="module">

import * as THREE from
"https://unpkg.com/three@0.179.1/build/three.module.js";

window.THREE = THREE;

import "./src/app/App.js";

</script>

</body>

</html>
